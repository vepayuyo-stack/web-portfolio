<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get in touch with DevNexus. Submit a form to request quotes, consulting, or general info."
    />
    <title>Contact Us | Vince Ezekiel P. Payuyo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">Vince Payuyo</div>
      <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Toggle Navigation"
      >
        ☰
      </button>
      <nav id="navMenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">Services</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contact-container">
        <h1>Get In Touch</h1>
        <p>
          Fill out the form below, and our team will get back to you within 24
          hours.
        </p>

        <div id="error-message" class="error-box"></div>

        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="username">Full Name:</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Your name..."
            />
          </div>
          <div class="form-group">
            <label for="email">Email Address:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your email address..."
            />
          </div>
          <div class="form-group">
            <label for="message">Your Message:</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="How can we help you?"
            ></textarea>
          </div>
          <button type="submit" class="btn-submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Vince Payuyo. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
